<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WrapStore — Phone Cases & Accessories</title>
    <meta name="description" content="Cases for iPhone and Samsung, plus everyday accessories. Choose your phone, pick a design, pay securely online." />

    <!-- Self-hosted font preloads: Poppins 400, Poppins 600, and DM Serif Display 400 -->
    <link rel="preload" href="/fonts/poppins-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/poppins-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/dm-serif-display-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

    <!-- Intro Video & Logo Preload -->
    <link rel="preload" href="/intro.mp4" as="video" type="video/mp4" />
    <link rel="preload" href="/logo.png" as="image" />

    <!-- Critical Intro CSS: Inlined for instantaneous zero-flash presentation -->
    <style id="wrapstore-intro-critical-css">
      #wrapstore-intro {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #050505;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        height: 100dvh;
        width: 100vw;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        box-sizing: border-box;
      }
      #wrapstore-intro-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        pointer-events: none;
      }
      #wrapstore-intro-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.75) 100%);
        backdrop-filter: blur(1px);
        -webkit-backdrop-filter: blur(1px);
        z-index: 2;
        pointer-events: none;
      }
      #wrapstore-intro-content {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #wrapstore-intro-logo {
        display: block;
        width: clamp(220px, 62vw, 420px);
        height: auto;
        max-height: 40vh;
        max-height: 40dvh;
        object-fit: contain;
        clip-path: none;
        -webkit-clip-path: none;
        opacity: 1;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: none;
        filter: drop-shadow(0 10px 32px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 1px rgba(255, 255, 255, 0.35));
      }
      html.no-intro #wrapstore-intro {
        display: none !important;
      }
    </style>
    <noscript>
      <style>
        #wrapstore-intro { display: none !important; }
      </style>
    </noscript>
  </head>
  <body class="bg-[#FAFAF9] text-[#141414] antialiased">
    <!-- Inline Decision Script: checks accessibility preferences -->
    <script>
      (function() {
        try {
          var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (prefersReduced) {
            document.documentElement.classList.add('no-intro');
            window.__WRAPSTORE_INTRO_ELIGIBLE__ = false;
            return;
          }
          window.__WRAPSTORE_INTRO_ELIGIBLE__ = true;
          document.documentElement.classList.add('has-intro');
        } catch(e) {
          document.documentElement.classList.add('no-intro');
          window.__WRAPSTORE_INTRO_ELIGIBLE__ = false;
        }
      })();
    </script>

    <!-- Pre-rendered intro markup: background video plays from second 4 till React DOM loads -->
    <div id="wrapstore-intro" role="dialog" aria-modal="true" aria-label="WrapStore Loading">
      <video
        id="wrapstore-intro-video"
        playsinline
        webkit-playsinline
        muted
        autoplay
        loop
        preload="auto"
        aria-hidden="true"
      >
        <source src="/intro.mp4#t=4" type="video/mp4" />
      </video>

      <div id="wrapstore-intro-overlay" aria-hidden="true"></div>

      <div id="wrapstore-intro-content">
        <img
          id="wrapstore-intro-logo"
          src="/logo.png"
          alt="WrapStore"
          width="349"
          height="96"
          loading="eager"
          decoding="async"
        />
      </div>
    </div>

    <!-- Intro Lifecycle Script: Starts video at second 4 & provides dismiss handler when React DOM loads -->
    <script>
      (function() {
        if (!window.__WRAPSTORE_INTRO_ELIGIBLE__) {
          var el = document.getElementById('wrapstore-intro');
          if (el) el.remove();
          return;
        }

        var video = document.getElementById('wrapstore-intro-video');
        if (video) {
          function setTimeFour() {
            try {
              if (video.currentTime < 4) {
                video.currentTime = 4;
              }
            } catch(e) {}
            var p = video.play();
            if (p && typeof p.catch === 'function') p.catch(function() {});
          }

          setTimeFour();
          video.addEventListener('loadedmetadata', setTimeFour);
          video.addEventListener('canplay', setTimeFour);
          video.addEventListener('loadeddata', setTimeFour);

          // Loop only from second 4 onwards
          video.addEventListener('timeupdate', function() {
            if (video.currentTime < 4) {
              try { video.currentTime = 4; } catch(e) {}
            }
          });
        }

        // Logo remains static and centered in the loading animation (no wipe/slide animation)
        var logo = document.getElementById('wrapstore-intro-logo');
        if (logo) {
          logo.style.clipPath = 'none';
          logo.style.webkitClipPath = 'none';
          logo.style.opacity = '1';
        }

        window.__WRAPSTORE_INTRO_START_TIME__ = performance.now();
        window.__DISMISS_WRAPSTORE_INTRO__ = function() {
          var intro = document.getElementById('wrapstore-intro');
          if (!intro || intro.dataset.dismissed) return;
          intro.dataset.dismissed = 'true';

          var elapsed = performance.now() - (window.__WRAPSTORE_INTRO_START_TIME__ || 0);
          // Wait at least 850ms so the initial logo reveal & video start are visibly experienced
          var minWait = Math.max(0, 850 - elapsed);

          setTimeout(function() {
            intro.style.transition = 'opacity 450ms cubic-bezier(0.4, 0, 0.2, 1)';
            intro.style.opacity = '0';
            intro.style.pointerEvents = 'none';

            setTimeout(function() {
              var v = document.getElementById('wrapstore-intro-video');
              if (v) {
                try { v.pause(); } catch(e) {}
              }
              if (intro.parentNode) intro.parentNode.removeChild(intro);
              document.documentElement.classList.remove('has-intro');
              document.documentElement.classList.add('no-intro');
              try {
                window.dispatchEvent(new CustomEvent('wrapstore:intro:done'));
              } catch(e) {}
            }, 470);
          }, minWait);
        };
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
